<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>5DRAGONS Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

<div data-nav-root></div>

<section class="section">
    <div class="container">

        <div class="card form">

            <h1>Login</h1>

            <form id="login-form">

                <div class="fields">

                    <div class="field full">
                        <label>Email</label>
                        <input
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="field full">
                        <label>Password</label>
                        <input
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                </div>

                <button class="btn" type="submit">
                    LOGIN
                </button>

                <p id="form-status" class="status"></p>

            </form>

            <p class="muted">
                Nie masz konta? Utwórz je w formularzu poniżej.
            </p>

            <form id="register-form">

                <div class="fields">

                    <div class="field">
                        <label>Username / Discord</label>
                        <input
                            name="username"
                            required
                        >
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="field full">
                        <label>Password</label>
                        <input
                            name="password"
                            type="password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                </div>

                <button class="btn alt" type="submit">
                    REGISTER
                </button>

            </form>

        </div>

    </div>
</section>

<div data-footer></div>

<script src="js/main.js"></script>

</body>
</html>
