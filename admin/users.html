<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5DRAGONS | Users</title>
    <meta name="description" content="5DRAGONS user management">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/Style.css">
    <link rel="stylesheet" href="../CSS/Animations.css">
    <link rel="stylesheet" href="../CSS/Responsive.css">

    <style>
        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .admin-search {
            width: min(420px, 100%);
        }

        .admin-search input {
            width: 100%;
            box-sizing: border-box;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 16px;
            border-radius: 6px;
            outline: none;
            font: inherit;
        }

        .admin-search input:focus {
            border-color: var(--red);
        }

        .admin-table-wrap {
            width: 100%;
            overflow-x: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .admin-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        .admin-table th,
        .admin-table td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .admin-table th {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .admin-table td {
            color: var(--text);
            font-size: 14px;
        }

        .admin-table tr:last-child td {
            border-bottom: 0;
        }

        .user-name {
            font-weight: 700;
        }

        .user-email {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .role-owner {
            border-color: rgba(229, 9, 20, .7);
            color: var(--red-light);
        }

        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-button {
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .admin-button:hover {
            border-color: var(--red);
            color: var(--red-light);
        }

        .admin-button.danger:hover {
            background: rgba(229, 9, 20, .1);
        }

        .admin-empty,
        .admin-loading,
        .admin-error {
            padding: 45px 20px;
            text-align: center;
            color: var(--muted);
        }

        .admin-error {
            color: var(--red-light);
        }

        .admin-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .78);
        }

        .admin-modal.active {
            display: flex;
        }

        .admin-modal-box {
            width: min(520px, 100%);
            background: var(--panel-2);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 28px;
        }

        .admin-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .admin-modal-header h2 {
            margin: 0;
        }

        .modal-close {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--white);
        }

        .admin-form-group {
            margin-bottom: 18px;
        }

        .admin-form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .admin-form-group input,
        .admin-form-group select {
            width: 100%;
            box-sizing: border-box;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 14px;
            border-radius: 5px;
            outline: none;
            font: inherit;
        }

        .admin-form-group input:focus,
        .admin-form-group select:focus {
            border-color: var(--red);
        }

        .admin-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .admin-status {
            margin-top: 14px;
            min-height: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .admin-table th,
            .admin-table td {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div id="site-nav"></div>

<main class="page">

    <section class="page-hero">
        <div class="container">
            <p class="eyebrow">5DRAGONS ADMINISTRATION</p>
            <h1>USERS</h1>
            <p class="page-hero-description">
                Manage registered accounts and organization roles.
            </p>
        </div>
    </section>

    <section class="section">
        <div class="container">

            <div class="admin-toolbar">

                <div>
                    <p class="section-kicker">ACCOUNT MANAGEMENT</p>
                    <h2>REGISTERED USERS</h2>
                </div>

                <div class="admin-search">
                    <input
                        type="search"
                        id="user-search"
                        placeholder="Search users..."
                        autocomplete="off"
                    >
                </div>

            </div>

            <div class="admin-table-wrap">

                <table class="admin-table">

                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Discord</th>
                            <th>CS2</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="users-table">

                        <tr>
                            <td colspan="6" class="admin-loading">
                                Loading users...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </section>

</main>

<div id="site-footer"></div>

<div class="admin-modal" id="role-modal">

    <div class="admin-modal-box">

        <div class="admin-modal-header">
            <h2>EDIT ROLE</h2>

            <button
                class="modal-close"
                id="modal-close"
                type="button"
            >
                ×
            </button>
        </div>

        <form id="role-form">

            <div class="admin-form-group">
                <label>User</label>

                <input
                    type="text"
                    id="role-user-display"
                    disabled
                >
            </div>

            <div class="admin-form-group">

                <label>Role</label>

                <select id="role-select" required>

                    <option value="MEMBER">MEMBER</option>
                    <option value="EDITOR">EDITOR</option>
                    <option value="COACH">COACH</option>
                    <option value="MANAGER">MANAGER</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="OWNER">OWNER</option>

                </select>

            </div>

            <div
                class="admin-status"
                id="role-status"
            ></div>

            <div class="admin-modal-actions">

                <button
                    class="button secondary"
                    type="button"
                    id="cancel-role"
                >
                    CANCEL
                </button>

                <button
                    class="button primary"
                    type="submit"
                >
                    SAVE ROLE
                </button>

            </div>

        </form>

    </div>

</div>

<script src="../JS/Main.js"></script>

<script>

(function () {

    const API_BASE =
        "https://calm-sunset-b06e.matkosmo27.workers.dev";

    const table =
        document.getElementById("users-table");

    const search =
        document.getElementById("user-search");

    const modal =
        document.getElementById("role-modal");

    const modalClose =
        document.getElementById("modal-close");

    const cancelRole =
        document.getElementById("cancel-role");

    const roleForm =
        document.getElementById("role-form");

    const roleUserDisplay =
        document.getElementById("role-user-display");

    const roleSelect =
        document.getElementById("role-select");

    const roleStatus =
        document.getElementById("role-status");

    let users = [];
    let selectedUser = null;


    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function getToken() {

        return localStorage.getItem("5dragons_token");

    }


    function getCurrentUser() {

        try {

            return JSON.parse(
                localStorage.getItem("5dragons_user")
            );

        } catch {

            return null;

        }

    }


    function authHeaders(extra = {}) {

        const token = getToken();

        return {
            ...extra,
            "Authorization": `Bearer ${token}`
        };

    }


    function renderUsers(list) {

        if (!list.length) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="admin-empty"
                    >
                        No users found.
                    </td>
                </tr>
            `;

            return;

        }


        table.innerHTML = list.map(user => {

            const role =
                String(user.role || "MEMBER").toUpperCase();

            const isOwner =
                role === "OWNER";

            const created =
                user.created_at
                    ? new Date(user.created_at).toLocaleDateString()
                    : "—";


            return `
                <tr>

                    <td>

                        <div class="user-name">
                            ${escapeHTML(user.email || "Unknown")}
                        </div>

                        <div class="user-email">
                            ID: ${escapeHTML(user.id ?? "—")}
                        </div>

                    </td>

                    <td>
                        ${escapeHTML(user.discord || "—")}
                    </td>

                    <td>
                        ${escapeHTML(user.cs2_nick || "—")}
                    </td>

                    <td>

                        <span class="role-badge ${isOwner ? "role-owner" : ""}">
                            ${escapeHTML(role)}
                        </span>

                    </td>

                    <td>
                        ${escapeHTML(created)}
                    </td>

                    <td>

                        <div class="user-actions">

                            ${
                                isOwner
                                ? `<span class="user-email">Protected</span>`
                                : `
                                    <button
                                        class="admin-button"
                                        type="button"
                                        data-action="role"
                                        data-id="${escapeHTML(user.id)}"
                                    >
                                        ROLE
                                    </button>

                                    <button
                                        class="admin-button danger"
                                        type="button"
                                        data-action="delete"
                                        data-id="${escapeHTML(user.id)}"
                                    >
                                        DELETE
                                    </button>
                                `
                            }

                        </div>

                    </td>

                </tr>
            `;

        }).join("");

    }


    async function loadUsers() {

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="admin-loading"
                >
                    Loading users...
                </td>
            </tr>
        `;


        const token = getToken();

        if (!token) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="admin-error"
                    >
                        Session expired. Please log in again.
                    </td>
                </tr>
            `;

            return;

        }


        try {

            const response = await fetch(
                `${API_BASE}/api/users`,
                {
                    method: "GET",

                    headers: authHeaders()
                }
            );


            const result =
                await response.json().catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    `HTTP ${response.status}`
                );

            }


            if (!Array.isArray(result.users)) {

                throw new Error(
                    "Invalid users response"
                );

            }


            users = result.users;

            renderUsers(users);


        } catch (error) {

            console.error(error);

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="admin-error"
                    >
                        ${escapeHTML(
                            error.message ||
                            "Could not load users."
                        )}
                    </td>
                </tr>
            `;

        }

    }


    function openRoleModal(user) {

        selectedUser = user;

        roleUserDisplay.value =
            user.email ||
            user.discord ||
            `User ${user.id}`;

        roleSelect.value =
            String(user.role || "MEMBER").toUpperCase();

        roleStatus.textContent = "";

        modal.classList.add("active");

    }


    function closeRoleModal() {

        modal.classList.remove("active");

        selectedUser = null;

        roleStatus.textContent = "";

    }


    search.addEventListener(
        "input",
        function () {

            const query =
                this.value.trim().toLowerCase();


            if (!query) {

                renderUsers(users);

                return;

            }


            const filtered =
                users.filter(user => {

                    return [
                        user.email,
                        user.discord,
                        user.cs2_nick,
                        user.role
                    ]
                        .filter(Boolean)
                        .some(value =>
                            String(value)
                                .toLowerCase()
                                .includes(query)
                        );

                });


            renderUsers(filtered);

        }
    );


    table.addEventListener(
        "click",
        async function (event) {

            const button =
                event.target.closest(
                    "button[data-action]"
                );

            if (!button) return;


            const userId =
                button.dataset.id;


            const user =
                users.find(
                    item =>
                        String(item.id) ===
                        String(userId)
                );


            if (!user) return;


            if (button.dataset.action === "role") {

                openRoleModal(user);

                return;

            }


            if (button.dataset.action === "delete") {

                if (
                    String(user.role).toUpperCase() ===
                    "OWNER"
                ) {

                    alert(
                        "OWNER cannot be deleted."
                    );

                    return;

                }


                const confirmed =
                    confirm(
                        `Delete account ${
                            user.email ||
                            user.discord ||
                            user.id
                        }?`
                    );


                if (!confirmed) return;


                try {

                    const response =
                        await fetch(
                            `${API_BASE}/api/users/${encodeURIComponent(user.id)}`,
                            {
                                method: "DELETE",
                                headers: authHeaders()
                            }
                        );


                    const result =
                        await response
                            .json()
                            .catch(() => ({}));


                    if (
                        !response.ok ||
                        result.success === false
                    ) {

                        throw new Error(
                            result.error ||
                            "Delete failed"
                        );

                    }


                    await loadUsers();


                } catch (error) {

                    console.error(error);

                    alert(
                        error.message ||
                        "Could not delete this user."
                    );

                }

            }

        }
    );


    roleForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            if (!selectedUser) return;


            const newRole =
                roleSelect.value;


            if (
                String(selectedUser.role).toUpperCase() ===
                "OWNER" &&
                newRole !== "OWNER"
            ) {

                roleStatus.textContent =
                    "The OWNER role is protected.";

                return;

            }


            roleStatus.textContent =
                "Saving...";


            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/users/${encodeURIComponent(selectedUser.id)}/role`,
                        {
                            method: "PATCH",

                            headers: authHeaders({
                                "Content-Type":
                                    "application/json"
                            }),

                            body: JSON.stringify({
                                role: newRole
                            })
                        }
                    );


                const result =
                    await response
                        .json()
                        .catch(() => ({}));


                if (
                    !response.ok ||
                    result.success === false
                ) {

                    throw new Error(
                        result.error ||
                        "Role update failed"
                    );

                }


                closeRoleModal();

                await loadUsers();


            } catch (error) {

                console.error(error);

                roleStatus.textContent =
                    error.message ||
                    "Could not update role.";

            }

        }
    );


    modalClose.addEventListener(
        "click",
        closeRoleModal
    );


    cancelRole.addEventListener(
        "click",
        closeRoleModal
    );


    modal.addEventListener(
        "click",
        function (event) {

            if (event.target === modal) {

                closeRoleModal();

            }

        }
    );


    const currentUser =
        getCurrentUser();


    if (
        currentUser &&
        ["OWNER", "ADMIN"].includes(
            String(
                currentUser.role || ""
            ).toUpperCase()
        )
    ) {

        loadUsers();

    } else {

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="admin-error"
                >
                    You do not have permission to access this page.
                </td>
            </tr>
        `;

    }

})();

</script>

</body>
</html>
